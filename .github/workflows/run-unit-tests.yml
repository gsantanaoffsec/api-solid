# workflows -> esteira de comandos -> vários comandos que eu quero executar quando um código novo chegar no repositório

name: Run Unit Tests

# quando executar ?
on: [push]

# o que será executado?
jobs:
  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - run: npm ci
      - run: npm run test
